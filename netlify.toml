# Netlify Configuration for React/Vite Single Page Application
# This file teaches Netlify how to compile and host your premium React web applet.

[build]
  # Commands to install dependencies and run compiling
  command = "npm run build"
  
  # Vite outputs built production assets and compiled HTML directly to `dist`
  publish = "dist"

[build.environment]
  # Use a modern node runtime speed for compatibility
  NODE_VERSION = "20"

# Netlify SPA redirect rule so routing falls back to index.html if needed
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

